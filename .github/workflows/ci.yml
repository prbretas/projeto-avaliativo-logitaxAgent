name: CI — LogitaxAgent

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install ruff
      - name: Run ruff check
        run: ruff check src/ tests/ scripts/
      - name: Run ruff format check
        run: ruff format --check src/ tests/ scripts/

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest tests/ -v --tb=short -q
        env:
          CHROMADB_PATH: ./data/chromadb
          SQLITE_PATH: ./data/test_auditoria.db

  build:
    name: Build (install + import validation)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e .
      - name: Validate imports
        run: |
          python -c "from src.models import OperacaoFrete, ResultadoAno, AgentState"
          python -c "from src.graph.graph import build_graph"
          python -c "from src.api.main import app"
          python -c "from src.observability.logger import NodeLogger, log_audit_event"
          python -c "from src.persistence.checkpointer import SessionCheckpointer"
          echo "All critical imports validated successfully"
