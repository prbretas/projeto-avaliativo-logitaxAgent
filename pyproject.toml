[project]
name = "logitax-agent"
version = "0.1.0"
description = "Sistema híbrido agêntico que simula o impacto financeiro da Reforma Tributária brasileira (IBS/CBS) sobre operações de frete"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "langgraph>=0.2.0",
    "pydantic>=2.9.0",
    "chromadb>=0.5.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "streamlit>=1.37.0",
]

[project.optional-dependencies]
mcp = [
    "mcp-fiscal-brasil>=0.5.0",
]
dev = [
    "pytest>=8.3.0",
    "hypothesis>=6.112.0",
    "ruff>=0.6.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "mcp-fiscal-brasil>=0.5.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/graph/nodes/generate_justification.py" = ["E501"]
"tests/test_properties_*.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]
